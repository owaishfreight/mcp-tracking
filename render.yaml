services:
  - type: web
    name: mcp-tracking
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python tracking_server.py
    envVars:
      - key: MCP_TRANSPORT
        value: http
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: MCP_API_KEY
        generateValue: true   # Render creates a random secret; copy it from the dashboard
